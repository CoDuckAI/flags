name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved version tag on main, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag before installing or publishing
        run: |
          node --input-type=module -e 'import { releaseVersion } from "./scripts/release-policy.mjs"; releaseVersion(process.env.RELEASE_TAG);'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm proof
        env:
          FLAGS_PROOF_OUTPUT: ${{ runner.temp }}/flags-protocol-proof
      - run: pnpm release:pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-sdk-packages
          path: release/
          if-no-files-found: error
      - run: node scripts/publish.mjs
