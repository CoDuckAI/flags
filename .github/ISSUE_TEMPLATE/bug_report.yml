name: Bug report
description: Report unexpected SDK behavior with a reproducible example.
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include SDK keys, admin keys or personal data. Report security issues privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SDK package and version
      placeholder: "@coduck/flags 0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a redacted ruleset, context and evaluation result if relevant.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
